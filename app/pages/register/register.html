<div class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-center text-gray-900">Create an Account</h2>
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Username</label>
        <input type="text" name="username" [(ngModel)]="newData.username" required class="w-full px-3 py-2 mt-1 border rounded-md focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border-gray-300">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" name="email" [(ngModel)]="newData.email" required class="w-full px-3 py-2 mt-1 border rounded-md focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border-gray-300">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" name="password" [(ngModel)]="newData.password" required class="w-full px-3 py-2 mt-1 border rounded-md focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border-gray-300">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">ConfirmPassword</label>
        <input type="password" name="confirmPassword" [(ngModel)]="newData.confirmPassword" required class="w-full px-3 py-2 mt-1 border rounded-md focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border-gray-300">
      </div>
      <button type="submit" [disabled]="!registerForm.form.valid"
      class="w-full px-4 py-2 text-white bg-green-600 rounded-md hover:bg-green-700 disabled:bg-gray-400">
        Register
      </button>
    </form>
    <p>Already have an account?
      <a href="/login" class="font-medium text-blue-600 hover:text-blue-500">Login here</a>
    </p>
  </div>
</div>
