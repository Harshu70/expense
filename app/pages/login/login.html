<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md p-8 space-y-6 bg-gray-100 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-center text-gray-900">Sign in to Expense Tracker</h2>
    
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-4">
      
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          [(ngModel)]="loginData.username" 
          required
          class="w-full px-3 py-2 mt-1 border rounded-md focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border-gray-300"
          placeholder="Enter your username"
        >
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="loginData.password" 
          required
          class="w-full px-3 py-2 mt-1 border rounded-md focus:ring-blue-500 focus:border-blue-500 bg-gray-50 border-gray-300"
          placeholder="Enter your password"
        >
      </div>

      <button 
        type="submit" 
        [disabled]="!loginForm.form.valid"
        class="w-full px-4 py-2 text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-400"
      >
        Sign In
      </button>
    </form>

    <p class="text-sm text-center text-gray-600">
      Don't have an account? 
      <a href="/register" class="font-medium text-blue-600 hover:text-blue-500">Register here</a>
    </p>
  </div>
</div>
